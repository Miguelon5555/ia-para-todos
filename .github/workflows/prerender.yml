name: Pre-renderizar contenido del blog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar rss-parser
        run: npm install --no-save rss-parser

      - name: Pre-renderizar index.html
        run: node prerender.mjs

      - name: Commit si hay cambios
        run: |
          if git diff --quiet index.html; then
            echo "Sin cambios en index.html"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: pre-render diario del contenido"
          git push
